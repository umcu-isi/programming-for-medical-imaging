name: Release course materials

on:
  push:
    branches:
      - 'main'
    paths:
      - 'course_materials/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Zip Course materials
      run: |
        rm -f course_materials.zip
        cd course_materials
        zip -r ../course_materials.zip .

    - name: Delete previous release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view course-materials >/dev/null 2>&1; then
          gh release delete course-materials --yes --cleanup-tag
        fi

    - name: Create new release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create course-materials \
          course_materials.zip \
          --title "Latest course materials" \
          --notes "Automatically generated from the latest version of course_materials/ on main." \
          --target main
